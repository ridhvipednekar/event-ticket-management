<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registration Confirmation</title>


    <style>

        /* =========================
           BASIC PAGE
        ========================= */

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background-color: #05051c;

            color: white;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        /* =========================
           CONFIRMATION BOX
        ========================= */

        .confirmation-box {

            width: 600px;

            max-width: 90%;

            background-color: #140a2d;

            border: 1px solid #ff42b1;

            border-radius: 25px;

            padding: 45px;

            text-align: center;

            box-shadow:
                0 0 20px rgba(255, 66, 177, 0.4),
                0 0 50px rgba(255, 66, 177, 0.15);
        }


        /* =========================
           SUCCESS ICON
        ========================= */

        .success-icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background-color: #ff42b1;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 40px;

            font-weight: bold;
        }


        /* =========================
           HEADING
        ========================= */

        .confirmation-box h1 {

            color: #ff42b1;

            font-size: 38px;

            margin-bottom: 30px;
        }

        .confirmation-box h2 {

            font-size: 24px;

            margin-bottom: 10px;
        }

        .confirmation-box p {

            color: #cdbdca;

            font-size: 16px;

            line-height: 1.6;
        }



    


        


        /* =========================
           BACK BUTTON
        ========================= */

        .home-button {

            display: inline-block;

            margin-top: 20px;

            padding: 13px 28px;

            background-color: #ff42b1;

            color: white;

            text-decoration: none;

            border-radius: 25px;

            font-weight: bold;

            transition: 0.3s;
        }

        .home-button:hover {

            background-color: #e52c98;

            box-shadow:
                0 0 15px #ff42b1;
        }


        
    </style>

</head>


<body>


    <div class="confirmation-box">

        <div class="success-icon">
            ✓
        </div>

        <div class="ticket-details">

        <h1>
            REGISTRATION CONFIRMED!
        </h1>

        <h2>
            Thank You for Registering
        </h2>

        <p>
            Your event ticket has been successfully reserved.
        </p>
           

        </div>


    
<a
            href="entrypass-tech-gold.html"
            class="home-button">
            click here for entry pass
        </a>

        


    </div>


</body>

</html>
