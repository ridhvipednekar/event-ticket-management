<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Payment</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #05051c;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .payment-container {
            width: 100%;
            max-width: 550px;

            background: #10082b;

            border: 1px solid #ff2da8;
            border-radius: 25px;

            padding: 45px;

            text-align: center;

            box-shadow:
                0 0 20px rgba(255, 45, 168, 0.4),
                0 0 50px rgba(255, 45, 168, 0.15);
        }

        .payment-container h1 {
            color: #ff3dbf;
            font-size: 34px;
            margin-bottom: 12px;

            text-shadow:
                0 0 12px rgba(255, 61, 191, 0.5);
        }

        .payment-container .subtitle {
            color: #d8cde0;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .amount {
            font-size: 24px;
            font-weight: bold;
            color: white;

            margin-bottom: 25px;
        }

        .amount span {
            color: #ff42b1;
        }

        .qr-box {
            background: white;

            width: 260px;
            height: 260px;

            margin: 0 auto 25px;

            padding: 15px;

            border-radius: 15px;

            box-shadow:
                0 0 15px rgba(255, 255, 255, 0.5),
                0 0 30px rgba(255, 45, 168, 0.5);
        }

        .qr-box img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }

        .scan-text {
            color: #f4d5e8;
            font-size: 15px;
            line-height: 1.6;

            margin-bottom: 25px;
        }

        .payment-note {
            background: rgba(255, 45, 168, 0.08);

            border: 1px solid rgba(255, 45, 168, 0.35);

            border-radius: 12px;

            padding: 15px;

            color: #d8cde0;

            font-size: 14px;

            margin-bottom: 25px;
        }

        .payment-btn {
            display: inline-block;

            width: 100%;

            padding: 15px;

            border-radius: 30px;

            border: 1px solid #ff38ad;

            background: #ff2da8;

            color: white;

            text-decoration: none;

            font-size: 16px;

            font-weight: bold;

            letter-spacing: 0.5px;

            cursor: pointer;

            box-shadow:
                0 0 10px #ff38ad,
                0 0 25px rgba(255, 56, 173, 0.5);

            transition: 0.3s;
        }

        .payment-btn:hover {
            background: #e52c98;

            transform: translateY(-2px);

            box-shadow:
                0 0 15px #ff38ad,
                0 0 35px rgba(255, 56, 173, 0.8);
        }

        .back-btn {
            display: block;

            margin-top: 18px;

            color: #cfc8dc;

            text-decoration: none;

            font-size: 14px;
        }

        .back-btn:hover {
            color: #ff3dbf;
        }

        @media (max-width: 600px) {

            .payment-container {
                padding: 30px 20px;
            }

            .payment-container h1 {
                font-size: 28px;
            }

            .qr-box {
                width: 220px;
                height: 220px;
            }
        }
    </style>
</head>

<body>

    <div class="payment-container">

        <h1>COMPLETE PAYMENT</h1>

        <p class="subtitle">
            Scan the QR code below to complete your event registration.
        </p>

        <div class="amount">
            Amount: <span>₹500</span>
        </div>

        <!-- PAYMENT QR CODE -->
        <div class="qr-box">
            <img src="qr.png" alt="Payment QR Code">
        </div>

        <p class="scan-text">
            Scan this QR code using your UPI app<br>
            to complete the payment.
        </p>

        <div class="payment-note">
            After completing the payment, click the button below
            to continue with your registration.
        </div>

        <!-- GO TO CONFIRMATION PAGE -->
        <a href="confirmation-tech.html" class="payment-btn">
            PAYMENT COMPLETED →
        </a>

        <a href="register-tech.html" class="back-btn">
            ← Back to Registration
        </a>

    </div>

</body>
</html>
